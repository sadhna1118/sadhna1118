<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="30%" stop-color="#0c1527"/>
      <stop offset="70%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 54px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #00F7FF;
      letter-spacing: 2px;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #7dd3fc;
      letter-spacing: 0.2px;
    }
    .subdesc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      fill: #94a3b8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Cyber Grid Overlay -->
  <rect width="1000" height="240" rx="16" fill="url(#cyberGrid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="50" r="100" fill="#00F7FF" opacity="0.08" filter="url(#glow)"/>
  <circle cx="880" cy="190" r="120" fill="#6366F1" opacity="0.12" filter="url(#glow)"/>

  <!-- Bottom Waves with Hardcoded Permanent Paths (Never Blank!) -->
  <path d="M 0 195 C 200 170, 350 215, 550 185 C 750 155, 880 205, 1000 180 L 1000 240 L 0 240 Z" fill="url(#wave1Grad)"/>
  <path d="M 0 210 C 180 185, 380 230, 600 200 C 800 170, 900 215, 1000 195 L 1000 240 L 0 240 Z" fill="url(#wave2Grad)"/>

  <!-- Top Cyber Pill Badge -->
  <g transform="translate(500, 35)">
    <rect x="-185" y="-14" width="370" height="28" rx="14" fill="#031525" stroke="#00F7FF" stroke-width="1.2" stroke-opacity="0.7"/>
    <text text-anchor="middle" dominant-baseline="central" class="badge-text">🛡️ CYBERSECURITY &amp; SOC • AI SYSTEMS</text>
  </g>

  <!-- Main Title -->
  <text x="500" y="112" text-anchor="middle" class="title">Hi, I'm <tspan fill="#FFFFFF">Sadhna</tspan> 👋</text>

  <!-- Subtitle / Highlights -->
  <text x="500" y="156" text-anchor="middle" class="desc">Cybersecurity Operations &bull; Threat Hunting &bull; Agentic RAG &bull; Full-Stack</text>
  <text x="500" y="184" text-anchor="middle" class="subdesc">Defending Networks &bull; Building Grounded AI &bull; Transforming Security Telemetry</text>

  <!-- Bottom Glowing Gradient Line -->
  <rect x="150" y="236" width="700" height="3" rx="1.5" fill="url(#accentGrad)" filter="url(#glow)"/>
  <rect x="150" y="236" width="700" height="3" rx="1.5" fill="url(#accentGrad)"/>
</svg>